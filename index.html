<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<body>

    <div id="confeti-container"></div>

    <div class="centrar">
        <div class="contenedor-avion">
            <svg id="avion" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="50" height="50">
                <path fill="#fff" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L14 19v-5.5l8 2.5z"/>
            </svg>
        </div>

        <h2 class="subtitulo">Feliz Cumpleaños</h2>

        <div class="letras-contenedor">
            <div class="globo g-o"><span class="letra">O</span><div class="nudo"></div></div>
            <div class="globo g-l"><span class="letra">Y</span><div class="nudo"></div></div>

            <div class="globo g-i"><span class="letra">Y</span><div class="nudo"></div></div>
        </div>

        <div class="bloque-inferior-layout">
            <div class="card" ontouchstart="this.classList.toggle('hover');">
                
                <div class="page-interna interior-derecho">
                    <h4 class="color1">¡Feliz Cumpleaños!</h4>
                    <h4 class="color2">Oyuky  Sharay Radillo Rodriguez 🎂</h4>
                    <p>Eres una gran amiga el cual aprecio y quiero mucho.</p>
                    <p>Te deseo un año lleno de salud, tranquilidad y mucho éxito en tus metas.</p>
                    <p>Que disfrutes mucho tu día rodeada de tus seres queridos y amigos.</p>
                    <p class="text-right">Atte: Gael Lázaro 👋🐧</p>
                </div>

                <div class="imgBox">
                    <div class="cara frontal">
                        <div class="bark"></div>
                        <img src="https://i.pinimg.com/736x/f4/01/ab/f401ab67639a1813275c9dbd8cf9488b.jpg" alt="Snoopy Portada">
                    </div>
                    <div class="cara trasera">
                        <div class="marco-interno-foto">
                            <img src="Oyuky.jpg" alt="Olguita Cumpleañera" class="foto-interna">
                        </div>
                    </div>
